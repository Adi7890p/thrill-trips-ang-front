<header class=" w-full sticky top-0 z-50 px-4 py-3">
        <nav
                class="bg-blue-300/10 backdrop-blur-md border border-white/20 rounded-full mx-auto px-[5vw] py-4 shadow-2xl">
                <ul class="flex items-center justify-between">
                        <li class="text-3xl font-bold  tracking-wide font-display text-blue-500  uppercase">
                                <a routerLink="/home" class="">Thrill
                                        Trips</a>
                        </li>
                        <div class="flex space-x-6 items-center">
                                <li><a routerLink="/home"
                                                class="text-amber-600 hover:text-blue-500 transition-all duration-300 font-bold">Home</a>
                                </li>
                                <li><a routerLink="/about"
                                                class="text-amber-600 hover:text-blue-500 transition-all duration-300 font-bold">About</a>
                                </li>
                                <li><a routerLink="/explore"
                                                class="text-amber-600 hover:text-blue-500 transition-all duration-300 font-bold">Explore</a>
                                </li>

                                <li *ngIf="isLoggedIn() && !isAdmin()"><a routerLink="/user"
                                                class="text-amber-600 hover:text-blue-500 transition-all duration-300 font-bold">Dashboard</a>
                                </li>

                                <li *ngIf="isAdmin()"><a routerLink="/admin"
                                                class="text-amber-600 hover:text-blue-500 transition-all duration-300 font-bold">Admin
                                                Panel</a>
                                </li>

                                <li *ngIf="!isLoggedIn() && !isAdmin()"><a routerLink="/login"
                                                class="bg-blue-600 text-white px-5 py-2 rounded-full inline-block hover:bg-blue-700 transition-all duration-300 font-bold shadow-lg shadow-blue-500/20 ml-4 ">Login</a>
                                </li>
                                <li *ngIf="isLoggedIn() || isAdmin()">
                                        <button (click)="logout()"
                                                class="bg-red-600/10 text-red-600 px-5 py-2 rounded-full inline-block hover:bg-red-600 hover:text-white transition-all duration-300 font-bold border border-red-600/20 ml-4 ">Logout</button>
                                </li>
                        </div>
                </ul>
        </nav>
</header>

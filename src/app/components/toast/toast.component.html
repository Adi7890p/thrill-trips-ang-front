<div *ngIf="isVisible" [ngClass]="{
        'border-green-500': type === 'success',
        'border-red-500': type === 'error',
        'border-blue-500': type === 'info'
     }"
    class="fixed top-40 right-5 z-[999] min-w-[300px] p-5 rounded-2xl bg-white border-4 shadow-2xl animate-fade-in-left transition-all duration-300">
    <div class="flex items-center gap-3">
        <img src="/assets/msg.png" class="w-[2.5vw]" alt="">
        <p class="font-bold text-lg font- leading-tight text-white text-center w-full tracking-tight">{{ message }}</p>
    </div>
</div>

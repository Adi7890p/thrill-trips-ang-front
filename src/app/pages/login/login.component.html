<div class="flex justify-center py-[5vh] h-fit font-sans">
    <div class="bg-amber-500 w-1/2 min-h-[600px] h-fit p-8 rounded-2xl shadow-2xl transition-all duration-300">

        <div class="w-full flex justify-center gap-4 pb-10 pt-4 px-4 overflow-hidden">
            <div (click)="setTab('user')"
                [ngClass]="!isAdmin ? 'bg-amber-800 text-white shadow-inner scale-95' : 'bg-amber-600 text-amber-100 hover:bg-amber-700'"
                class="w-1/2 h-[8vh] text-xl font-bold flex items-center justify-center text-center rounded-xl cursor-pointer transition-all duration-300">
                User
            </div>
            <div (click)="setTab('admin')"
                [ngClass]="isAdmin ? 'bg-amber-800 text-white shadow-inner scale-95' : 'bg-amber-600 text-amber-100 hover:bg-amber-700'"
                class="w-1/2 h-[8vh] text-xl font-bold flex items-center justify-center text-center rounded-xl cursor-pointer transition-all duration-300">
                Admin
            </div>
        </div>

        <div>
            <h2 *ngIf="isAdmin" class="text-3xl font-display text-white uppercase mb-6 text-center tracking-wider">
                Admin Area
            </h2>
            <h2 *ngIf="!isAdmin" class="text-3xl font-display text-white uppercase mb-6 text-center tracking-wider">
                {{ isSignup ? 'Create Account' : 'Welcome Back' }}
            </h2>

            <form (ngSubmit)="onSubmit()">
                <div class="mb-4">
                    <label class="block text-amber-900 text-sm font-bold mb-2">
                        {{ isAdmin ? 'Admin Username' : 'Email Address' }}
                    </label>
                    <input [(ngModel)]="formData.identifier" name="identifier" [type]="isAdmin ? 'text' : 'email'"
                        required
                        class="shadow-lg appearance-none border-2 border-amber-600 rounded-xl w-full py-3 px-4 text-gray-800 leading-tight focus:outline-none focus:border-blue-500 transition-all font-semibold"
                        [placeholder]="isAdmin ? 'Admin Username' : 'Enter Email'">
                </div>

                <div class="mb-6">
                    <label class="block text-amber-900 text-sm font-bold mb-2">
                        {{ isSignup ? 'Create Password' : 'Password' }}
                    </label>
                    <input [(ngModel)]="formData.password" name="password" type="password" required
                        class="shadow-lg appearance-none border-2 border-amber-600 rounded-xl w-full py-3 px-4 text-gray-800 leading-tight focus:outline-none focus:border-blue-500 transition-all font-semibold"
                        placeholder="Enter Password">
                </div>

                <div class="flex items-center justify-between">
                    <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-8 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95">
                        {{ (isAdmin) ? 'ADMIN LOGIN' : (isSignup ? 'SIGN UP' : 'LOGIN') }}
                    </button>

                    <div *ngIf="!isAdmin" (click)="toggleSignup()"
                        class="text-amber-900 hover:text-white font-bold transition-colors cursor-pointer">
                        {{ isSignup ? 'Already have an account?' : 'New User? Sign Up' }}
                    </div>
                </div>

                <div *ngIf="!isAdmin">
                    <div class="relative flex py-8 items-center">
                        <div class="flex-grow border-t border-amber-800"></div>
                        <span class="flex-shrink mx-4 text-amber-900 font-black">OR</span>
                        <div class="flex-grow border-t border-amber-800"></div>
                    </div>

                    <div class="flex justify-center">
                        <button (click)="onGoogleLogin()" type="button"
                            class="bg-white group text-blue-600 border-2 border-blue-500 font-bold rounded-xl overflow-hidden hover:scale-105 transition-all duration-300 flex items-center shadow-xl">
                            <div class="p-3 bg-gray-50 group-hover:bg-white border-r border-blue-100 flex items-center">
                                <img src="assets/google.png" class="w-8 h-8 object-contain" alt="Google">
                            </div>
                            <div
                                class="bg-blue-600 text-white px-6 py-4 flex items-center h-full group-hover:bg-blue-700">
                                Continue with Google
                            </div>
                        </button>
                    </div>
                </div>

                <div class="pb-10"></div>

            </form>
        </div>
    </div>
